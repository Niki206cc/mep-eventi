    provincia: BG

  - id: leffe
    type: municipium
    enabled: true
    name: "Comune di Leffe"
    api: https://leffe-api.municipiumapp.it
    comune: "Leffe"
    zona: "Val Gandino"
    provincia: BG

  - id: ranica
    type: municipium
    enabled: true
    name: "Comune di Ranica"
    api: https://ranica-api.municipiumapp.it
    comune: "Ranica"
    zona: "Val Seriana"
    provincia: BG

  - id: valbondione
    type: municipium
    enabled: true
    name: "Comune di Valbondione"
    api: https://valbondione-api.municipiumapp.it
