  # ---------------- Valle Camonica
  - id: turismovallecamonica
    type: wp_rest
    enabled: true
    name: "Turismo Valle Camonica"
    base_url: https://www.turismovallecamonica.it
    rest_base: eventi
    modified_days: 90        # solo schede modificate negli ultimi 90 giorni
    max_pages: 2
    place_taxonomy: localita
    category_taxonomies: [tipologie, categorie_eventi]
    zona: "Valle Camonica"
    provincia: BS

  # ---------------- Lago d'Iseo / Alto Sebino
  - id: visitlakeiseo
    type: html
    enabled: true
    name: "Visit Lake Iseo"
    listing_urls:
      - https://visitlakeiseo.info/eventi/
    link_pattern: 'visitlakeiseo\.info/eventi/[a-z0-9\-]+/?$'
    exclude_pattern: '/eventi/page/|/eventi/?$'
    max_links: 80
    zona: "Lago d'Iseo"
